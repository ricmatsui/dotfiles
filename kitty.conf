# ~/.config/kitty/kitty.conf
#
# include ~/synced/Projects/dotfiles/kitty.conf

font_family Meslo LG S DZ
font_size 16.0

enable_audio_bell no

confirm_os_window_close 1

tab_bar_style separator
tab_bar_min_tabs 1
tab_separator " | "
# Claude Code sessions: green ● when idle (✳), red ● while working (spinner)
tab_title_template "{num_windows}{layout_name[0]} {fmt.fg._00552b + '●' if title[:1] == '✳' else fmt.fg._8b0000 + '●' if title[:1] in '◐◓◑◒' else title[:1]}{fmt.fg.tab}{title[1:]}"
tab_bar_edge top

macos_option_as_alt yes
macos_thicken_font 0.25

map kitty_mod+enter launch --cwd=current
map kitty_mod+m detach_tab ask

# Prompt for the OS window title; an empty entry reverts to following the active window's title
map kitty_mod+t launch --type=overlay --allow-remote-control zsh -c 'read "t?OS window title: " && kitten @ set-os-window-title ${t:+--} $t'

map kitty_mod+c close_shared_ssh_connections
map kitty_mod+a remote_control set-tab-color inactive_bg=NONE inactive_fg=NONE active_bg=NONE

map cmd+t new_tab_with_cwd !neighbor
map cmd+shift+t new_tab !neighbor

map cmd+n new_os_window_with_cwd
map cmd+shift+n new_os_window

map cmd+enter new_window_with_cwd
map cmd+shift+enter new_window

map cmd+k combine : clear_terminal scrollback active : send_text normal \x0c

allow_remote_control yes

enabled_layouts Tall,Fat,Stack

window_resize_step_cells 8
window_resize_step_lines 8

shell_integration disabled

map cmd+shift+a launch --type=overlay --allow-remote-control ~/synced/Projects/dotfiles/kitty-tab-switcher/kitty-tab-switcher

cursor_trail 80
cursor_trail_decay 0.08 0.12
cursor_trail_start_threshold 100
